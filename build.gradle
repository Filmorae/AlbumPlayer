plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'dev.geduu'

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        album_jukebox {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'maven.modrinth:audioplayer:UVK6lzoH'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.0'
    runtimeOnly 'maven.modrinth:audioplayer:UVK6lzoH'
    runtimeOnly 'maven.modrinth:simple-voice-chat:4cjovAfF'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

// Dependency-free DSP regression check; no test framework is necessary.
def meterCheckOutput = layout.buildDirectory.dir('classes/meterCheck')
tasks.register('compileMeterCheck', JavaCompile) {
    dependsOn tasks.named('compileJava')
    source = fileTree('src/check/java') { include '**/*.java' }
    classpath = files(sourceSets.main.output.classesDirs)
    destinationDirectory = meterCheckOutput
}
tasks.register('meterInputCheck', JavaExec) {
    dependsOn tasks.named('compileMeterCheck')
    classpath = files(meterCheckOutput, sourceSets.main.output.classesDirs)
    mainClass = 'dev.geduu.albumjukebox.MeterInputCheck'
}
tasks.named('check') { dependsOn tasks.named('meterInputCheck') }

// Client presentation logic also has dependency-free checks.
def clientCheckOutput = layout.buildDirectory.dir('classes/clientPresentationCheck')
tasks.register('compileClientPresentationCheck', JavaCompile) {
    dependsOn tasks.named('compileClientJava')
    source = fileTree('src/clientCheck/java') { include '**/*.java' }
    classpath = files(sourceSets.client.output.classesDirs, sourceSets.main.output.classesDirs)
    destinationDirectory = clientCheckOutput
}
tasks.register('clientPresentationCheck', JavaExec) {
    dependsOn tasks.named('compileClientPresentationCheck')
    classpath = files(clientCheckOutput, sourceSets.client.output.classesDirs, sourceSets.main.output.classesDirs)
    mainClass = 'dev.geduu.albumjukebox.client.ClientPresentationCheck'
}
tasks.named('check') { dependsOn tasks.named('clientPresentationCheck') }
